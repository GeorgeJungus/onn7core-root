; ESP32-S3 CAN interface for the 2016 Nissan Altima (L33).
;
; Two personalities via build flags:
;   -DSLCAN_ONLY=1   USB serial SLCAN only (plug into workbench as slcan0)
;   default          USB SLCAN + WiFi TCP SLCAN bridge (wireless sniffing)
;
; Board: generic ESP32-S3 devkit. Adjust pins in include/can_config.h.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

build_flags =
    -I include
    -D SLCAN_ONLY=0
    -D CAN_TX_GPIO=4
    -D CAN_RX_GPIO=5
    -D WIFI_SSID=\"YOUR_SSID\"
    -D WIFI_PASS=\"YOUR_PASS\"

; USB-serial-only build (no WiFi). Use when plugging straight into the PC.
[env:esp32s3_usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -I include
    -D SLCAN_ONLY=1
    -D CAN_TX_GPIO=4
    -D CAN_RX_GPIO=5
